trigger:
  branches:
    include:
      - main
      - feature/*
      - fix/*
      - refactor/*

pr:
  branches:
    include:
      - main

pool:
  name: 'IT_Incident_Hub_Local'

steps:
  - checkout: self
    fetchDepth: 0

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
    displayName: 'Seleccionar Python'

  - script: |
      python -m ensurepip --upgrade
      python -m pip install --upgrade pip
      python -m pip install -r backend/requirements.txt
      python -m pip install pytest
    displayName: 'Instalar dependencias backend'
    
  - task: PowerShell@2
    displayName: 'Ejecutar pruebas backend'
    inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(Build.SourcesDirectory)\backend"
          $env:PYTHONPATH = "$(Build.SourcesDirectory)\backend"
          python -m pytest tests -v

  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Seleccionar Node.js'

  - script: |
      cd frontend
      npm install
      npm run build
      npm test
    displayName: 'Build y pruebas frontend'

  - script: |
      mkdir -p "$(Build.ArtifactStagingDirectory)/incident-hub"
      cp -r backend frontend database docs devops "$(Build.ArtifactStagingDirectory)/incident-hub/"
      cp compose.yaml README.md "$(Build.ArtifactStagingDirectory)/incident-hub/"
    displayName: 'Preparar artefacto'

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/incident-hub'
      artifact: 'incident-hub'
    displayName: 'Publicar artefacto'
